<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<title>{{ doc_title }} {{ doc_no }}</title>
<style>
  @font-face { font-family: "Plex"; src: url("{{ fonts_dir }}/IBMPlexSansArabic-400.ttf"); font-weight: 400; }
  @font-face { font-family: "Plex"; src: url("{{ fonts_dir }}/IBMPlexSansArabic-600.ttf"); font-weight: 600; }
  @font-face { font-family: "Plex"; src: url("{{ fonts_dir }}/IBMPlexSansArabic-700.ttf"); font-weight: 700; }

  :root { --blue: #2563eb; --blue-d: #1d4ed8; --ink: #0f172a; --cyan: #06b6d4; --muted: #64748b; --line: #e2e8f0; --soft: #f1f5f9; --stamp: #1d4ed8; }

  @page {
    size: A4;
    margin: 30mm 15mm 20mm 15mm;
    @top-center { content: element(header); width: 100%; }
    @bottom-center { content: element(footer); width: 100%; }
  }
  html { font-family: "Plex", sans-serif; font-size: 9.6pt; line-height: 1.7; color: var(--ink); }
  body { margin: 0; }
  h1, h2, h3, p { margin: 0; }

  /* Running header & footer */
  .header { position: running(header); display: flex; align-items: center; justify-content: space-between; padding-bottom: 3mm; border-bottom: 1.6pt solid var(--blue); }
  .brand { display: flex; align-items: center; gap: 3mm; }
  .brand .logo { width: 9.5mm; height: auto; }
  .brand__name { font-size: 12.5pt; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .brand__sub { font-size: 7.6pt; color: var(--muted); line-height: 1.3; }
  .docmeta { text-align: end; line-height: 1.35; }
  .docmeta__title { font-size: 10.5pt; font-weight: 700; color: var(--blue-d); }
  .docmeta__no { font-size: 8pt; color: var(--muted); }
  .footer { position: running(footer); display: flex; justify-content: space-between; align-items: center; font-size: 7.4pt; color: var(--muted); border-top: .6pt solid var(--line); padding-top: 2mm; }
  .footer .pg::after { content: "{{ t.page }} " counter(page) " {{ t.of }} " counter(pages); }

  /* Typography & blocks */
  .title { font-size: 19pt; font-weight: 700; line-height: 1.3; margin-top: 1mm; }
  .kicker { font-size: 8.6pt; font-weight: 600; color: var(--blue); }
  .lead { color: #334155; margin-top: 2mm; }
  h2.sec { font-size: 11.5pt; font-weight: 700; margin: 7mm 0 2.5mm; display: flex; align-items: center; gap: 2.2mm; }
  h2.sec::before { content: ""; width: 2.2mm; height: 2.2mm; background: var(--cyan); transform: rotate(45deg); }
  .grid { display: flex; flex-wrap: wrap; border: .6pt solid var(--line); border-radius: 2.5mm; overflow: hidden; margin-top: 4mm; }
  .grid > div { width: 33.333%; padding: 2.4mm 3.2mm; border-bottom: .6pt solid var(--line); box-sizing: border-box; }
  .grid dt { font-size: 7.6pt; color: var(--muted); }
  .grid dd { margin: 0; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  table.kv td { padding: 1.9mm 2.6mm; border-bottom: .6pt solid var(--line); vertical-align: top; }
  table.kv td:first-child { width: 36%; color: var(--muted); }
  table.data th { background: var(--soft); font-size: 8pt; font-weight: 600; color: #475569; text-align: start; padding: 2mm 2.6mm; }
  table.data td { padding: 2mm 2.6mm; border-bottom: .6pt solid var(--line); }
  table.data .end, table.data th.end { text-align: end; }
  .num { font-feature-settings: "tnum"; direction: ltr; unicode-bidi: embed; }
  .money { display: flex; gap: 3mm; margin-top: 2mm; }
  .money > div { flex: 1; padding: 3mm 3.5mm; border-radius: 2.5mm; background: var(--soft); }
  .money dt { font-size: 7.8pt; color: var(--muted); }
  .money dd { margin: .5mm 0 0; font-size: 12.5pt; font-weight: 700; }
  .money .ok dd { color: #047857; }
  .money .due dd { color: #b45309; }
  .bar { height: 2mm; border-radius: 1mm; background: var(--line); margin-top: 3mm; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--blue); border-radius: 1mm; }
  .gallery { display: flex; flex-wrap: wrap; gap: 3mm; }
  .gallery img { width: calc(50% - 1.5mm); height: 52mm; object-fit: cover; border-radius: 2.5mm; }
  .banner { margin-top: 3mm; padding: 2.4mm 3.5mm; border-radius: 2mm; font-weight: 600; font-size: 8.6pt; }
  .banner--warn { background: #fef3c7; color: #92400e; }
  .muted { color: var(--muted); }
  .small { font-size: 7.8pt; }
  .keep { page-break-inside: avoid; break-inside: avoid; }

  /* Signatures */
  .signs { display: flex; gap: 10mm; margin-top: 6mm; page-break-inside: avoid; break-inside: avoid; }
  .sign { flex: 1; border: .6pt solid var(--line); border-radius: 3mm; padding: 4mm 5mm; }
  .sign__head { font-weight: 700; color: var(--blue-d); }
  .sign__art { position: relative; height: 30mm; margin: 1mm 0 2mm; }
  .sign__img { position: absolute; bottom: 2mm; max-height: 22mm; max-width: 44mm; }
  .sign__auto { position: absolute; bottom: 4mm; white-space: nowrap; font-size: 14pt; font-style: italic; font-weight: 600; color: #1e3a8a; letter-spacing: -.2pt; transform: rotate(-5deg); border-bottom: .9pt solid #1e3a8a; padding: 0 1mm .6mm; }
  [dir="rtl"] .sign__img, [dir="rtl"] .sign__auto { right: 0; }
  [dir="ltr"] .sign__img, [dir="ltr"] .sign__auto { left: 0; }
  .sign__line { font-size: 8.8pt; margin-top: 1.2mm; }
  .sign__line > span:first-child { color: var(--muted); }
  .dots { color: #94a3b8; letter-spacing: .4pt; }

  /* Stamp (explicit offsets: WeasyPrint does not support the `inset` shorthand) */
  .stamp { position: absolute; width: 40mm; height: 40mm; border-radius: 50%; color: var(--stamp); border: 1.6pt solid var(--stamp); box-sizing: border-box; }
  .stamp::before { content: ""; position: absolute; top: 1.3mm; left: 1.3mm; right: 1.3mm; bottom: 1.3mm; border: .8pt solid var(--stamp); border-radius: 50%; }
  .stamp::after { content: ""; position: absolute; top: 6.4mm; left: 6.4mm; right: 6.4mm; bottom: 6.4mm; border: .7pt dashed var(--stamp); border-radius: 50%; }
  .stamp__ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: 6.2pt; font-weight: 700; direction: ltr; }
  .stamp__ring span { position: absolute; left: 50%; top: 2.05mm; width: 2mm; margin-left: -1mm; height: 17.95mm; text-align: center; transform-origin: 50% 100%; line-height: 1; }
  .stamp__inner { position: absolute; top: 8.6mm; left: 7.4mm; width: 25.2mm; height: 22.8mm; text-align: center; line-height: 1.18; direction: ltr; }
  .stamp__stars { font-size: 4.4pt; letter-spacing: 1pt; margin-top: .4mm; }
  .stamp__company { font-size: 9pt; font-weight: 700; letter-spacing: 1.4pt; margin-top: .6mm; }
  .stamp__sub { font-size: 4.6pt; font-weight: 600; letter-spacing: .5pt; }
  .stamp__rule { width: 13mm; border-top: .7pt solid var(--stamp); margin: .9mm auto; }
  .stamp__ceo { font-size: 4.9pt; font-weight: 700; letter-spacing: .2pt; }
  .stamp__role { font-size: 4.4pt; font-weight: 600; margin-top: .3mm; }
  .stamp--sign { top: -4mm; transform: rotate(-14deg); opacity: .92; }
  [dir="rtl"] .stamp--sign { left: 2mm; }
  [dir="ltr"] .stamp--sign { right: 2mm; }
  .stamp--watermark { position: fixed; width: 40mm; height: 40mm; top: 118mm; left: 50%; margin-left: -20mm; transform: rotate(-16deg) scale(3.1); opacity: .1; }

  {% block styles %}{% endblock %}
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      {% include "core/pdf/_logo.html" %}
      <div>
        <div class="brand__name">{{ company.name }}</div>
        <div class="brand__sub">{{ company.name_other }}</div>
      </div>
    </div>
    <div class="docmeta">
      <div class="docmeta__title">{{ doc_title }}</div>
      <div class="docmeta__no"><span class="num">{{ doc_no }}</span> &middot; <span class="num">{{ today }}</span></div>
    </div>
  </div>
  <div class="footer">
    <span><span dir="ltr">{{ company.website }}</span> &middot; <span dir="ltr">{{ company.email }}</span> &middot; <span class="num">{{ company.phone }}</span></span>
    <span class="pg"></span>
  </div>
  {% block watermark %}{% endblock %}
  {% block content %}{% endblock %}
</body>
</html>
